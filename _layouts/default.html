<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.name and page.collection == "roles" %}{{ page.name }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.ability | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <p class="site-tagline">{{ site.description }}</p>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <p>Fan-made homebrew. Blood on the Clocktower is a trademark of The Pandemonium Institute.</p>
  </footer>
</body>
</html>
